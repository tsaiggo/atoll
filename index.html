<!doctype html>
<html lang="en">
  <head>
    <!--
      THESIS: Atoll is one quiet Windows status island that expands from a small Reef into useful media control; it refuses both widget-card clutter and literal Apple replication.
      OWN-WORLD: A restrained Windows Acrylic four-corner Island, high-contrast media hierarchy, sea-glass cyan signal, compact Segoe typography, and a single incomplete lagoon ring.
      STORY: The user notices one current status, acts in one step, and lets the surface recede without leaving the task.
      FIRST VIEWPORT: An 8-DIP-inset Reef occupies 96×32 DIP; meaningful state expands the same shell into a 256×56 compact surface or a 400×176 media stage.
      FORM: Operate mode, Windows Acrylic Island direction; user-pinned iPhone-inspired interaction grammar, with Apple assets, a copied Widgets Board grid, and decorative dashboard elements explicitly excluded.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#050506" media="(prefers-color-scheme: light)" />
    <title>Atoll</title>
  </head>
  <body>
    <div id="material-layer" aria-hidden="true" hidden>
      <canvas id="material-flow"></canvas>
    </div>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
